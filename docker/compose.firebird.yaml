name: grab-db-lab-firebird

services:
  firebird:
    image: firebirdsql/firebird:5.0.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FIREBIRD_PORT:-3050}:3050"
    environment:
      FIREBIRD_ROOT_PASSWORD: ${FIREBIRD_ROOT_PASSWORD:?Set FIREBIRD_ROOT_PASSWORD in .env}
      FIREBIRD_DATABASE: ${FIREBIRD_DATABASE:-grab_lab.fdb}
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    volumes:
      - firebird_data:/var/lib/firebird/data

volumes:
  firebird_data:
